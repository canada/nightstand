<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nightstand">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" id="touchIcon" href="">
<link rel="icon" id="favicon" href="">
<title>Nightstand</title>
<link rel="stylesheet" href="classic.css">
</head>
<body>
<div id="stage">
  <div class="clockp">
    <svg id="clock" viewBox="0 0 200 200" aria-label="アナログ時計">
      <circle class="face" cx="100" cy="100" r="100"/>
      <g id="ticks"></g>
      <g id="nums"></g>
      <g id="hH"><line class="stem" x1="100" y1="100" x2="100" y2="88"/><line class="bar" x1="100" y1="88" x2="100" y2="50"/></g>
      <g id="hM"><line class="stem" x1="100" y1="100" x2="100" y2="88"/><line class="bar" x1="100" y1="88" x2="100" y2="17"/></g>
      <circle class="capW" cx="100" cy="100" r="4.2"/>
      <g id="hS"><line class="sec" x1="100" y1="118" x2="100" y2="9"/></g>
      <circle class="capA" cx="100" cy="100" r="2.7"/>
      <circle class="capB" cx="100" cy="100" r="1"/>
    </svg>
  </div>
  <div class="infop">
    <section id="info">
      <div id="top">
        <div id="date">
          <div id="wday"></div>
          <div id="mday"></div>
        </div>
        <div id="wx">
          <div id="wxMain"><svg id="wxIcon" viewBox="0 0 32 32" aria-hidden="true"></svg><span id="wxTemp"></span></div>
          <div id="wxSub"></div><div id="wxSub2" class="sub2"></div>
        </div>
      </div>
      <div id="rule"></div>
      <div id="calhead"><span id="month"></span><span id="year"></span></div>
      <div id="grid"></div>
      <div id="foot"></div>
    </section>
  </div>
</div>
<div id="hot" aria-label="表示モード"><div id="modeBtn"><svg id="modeIcon" viewBox="0 0 16 16" aria-hidden="true"></svg><span id="modeLabel"></span></div></div>
<script src="classic.js"></script>
<script type="module">
if (new URLSearchParams(location.search).get("next") === "1") import("./enhancements.js?v=20261107-google-1");
</script>
</body>
</html>
